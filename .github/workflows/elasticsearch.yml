name: Build and Publish Elasticsearch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: 9.5.3

  # Docker Hub
  DOCKERHUB_IMAGE: koushenhai/elasticsearch9

  # Aliyun
  ALIYUN_REGISTRY: registry.cn-shenzhen.aliyuncs.com
  ALIYUN_IMAGE: registry.cn-shenzhen.aliyuncs.com/koushenhai/elasticsearch9

jobs:
  docker:
    name: Build and Push Elasticsearch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 登录阿里云镜像仓库
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 构建一次，同时推送 Docker Hub + 阿里云
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.ALIYUN_IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
